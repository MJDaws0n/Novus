name: Compiler

on:
  push:
    branches: [main, self-hosted-novus, self-hosted-linux32, 'release/v*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
        working-directory: legacy-go

  selfhost:
    name: Self-host and run ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin/arm64 }
          - { runner: macos-15-intel, target: darwin/amd64 }
          - { runner: ubuntu-24.04, target: linux/amd64 }
          - { runner: ubuntu-24.04-arm, target: linux/arm64 }
          - { runner: windows-2025, target: windows/amd64 }
          - { runner: windows-11-arm, target: windows/arm64 }
          - { runner: ubuntu-24.04, target: linux/386 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'windows/arm64' && 'arm64' || 'x64' }}
      - name: Install NASM
        if: matrix.target == 'windows/amd64'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
      - name: Bootstrap, reproduce, and test
        run: python scripts/bootstrap.py --package --target=${{ matrix.target }}
      - name: Exercise 32-bit cross compilation
        if: matrix.target == 'linux/amd64'
        run: python scripts/test-x86.py --compiler dist/novus-linux-amd64
      - name: Check out the pinned large application
        uses: actions/checkout@v4
        with:
          repository: MJDaws0n/Nox
          ref: af635107c6e8d81d1059062fecdbb96e408fc43f
          path: build/nox-reference
      - name: Enforce large-program compilation performance
        run: python scripts/benchmark-ci.py --target=${{ matrix.target }}
      - name: Save benchmark records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ strategy.job-index }}
          path: |
            build/benchmarks/results.json
            build/benchmarks/*.log
      - name: Save verified release binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ strategy.job-index }}
          path: dist/novus-*
          if-no-files-found: error
      - name: Save compiler and verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-${{ strategy.job-index }}
          path: build/selfhost/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bootstrap-tests, selfhost]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/novus-*
