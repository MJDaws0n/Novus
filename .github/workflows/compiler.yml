name: Compiler

on:
  push:
    branches: [main, novus-classes]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin/arm64, arch: arm64 }
          - { runner: macos-15-intel, target: darwin/amd64, arch: x86_64 }
          - { runner: ubuntu-24.04, target: linux/amd64, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, target: linux/arm64, arch: arm64 }
          - { runner: ubuntu-24.04, target: linux/x86, arch: x86 }
          - { runner: windows-2025, target: windows/amd64, arch: x86_64 }
          - { runner: windows-11-arm, target: windows/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure MSVC for Windows x64
        if: matrix.target == 'windows/amd64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install NASM
        if: matrix.target == 'windows/amd64'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
      - name: Check Windows ARM64 toolchain
        if: matrix.target == 'windows/arm64'
        shell: pwsh
        run: |
          Get-Command clang
          Get-Command lld-link
      - name: Test compiler
        run: go test ./...
      - name: Compile and run classes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go run ./cmd/novus --target=${{ matrix.target }} tests/classes/main.nov
          ./build/${{ runner.os == 'macOS' && 'darwin' || 'linux' }}_${{ matrix.arch }}/classes
      - name: Compile and run classes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go run ./cmd/novus --target=${{ matrix.target }} tests/classes/main.nov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./build/windows_${{ matrix.arch }}/classes.exe"
          exit $LASTEXITCODE

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Fx "const VERSION = \"${GITHUB_REF_NAME#v}\"" cmd/novus/main.go
          ./build-release.sh
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes novus-darwin-* novus-linux-* novus-windows-*.exe
